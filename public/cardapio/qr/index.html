<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR codes das mesas · Barcenaria</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&family=Cinzel:wght@600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-soft); color: var(--text); font: 400 var(--fs-md)/1.5 var(--font-body); }
    h1, p { margin: 0; }
    [hidden] { display: none !important; }
    :focus-visible { outline: var(--focus-ring); outline-offset: var(--focus-offset); }

    .controls { width: min(100% - 2 * var(--gutter), 60rem); margin: var(--space-8) auto; display: grid; gap: var(--space-5); }
    .controls h1 { font: 600 var(--fs-2xl)/1.1 var(--font-display); }
    .controls p { color: var(--text-muted); }
    .row { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: end; }
    label { display: grid; gap: var(--space-1); font: 600 var(--fs-sm)/1.2 var(--font-condensed); letter-spacing: 0.06em; text-transform: uppercase; }
    input[type="number"], input[type="url"] {
      min-height: var(--tap); padding: var(--space-2) var(--space-3); width: 8rem;
      border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font: inherit; text-transform: none; letter-spacing: 0;
    }
    input[type="url"] { width: min(100%, 26rem); }
    .check { display: inline-flex; flex-direction: row; align-items: center; gap: var(--space-2); min-height: var(--tap); }
    .check input { width: 1.25rem; height: 1.25rem; accent-color: var(--gold); }
    .btn {
      display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--tap); padding: 0 var(--space-5);
      border: 1px solid var(--gold); border-radius: var(--radius); background: var(--gold); color: var(--on-gold);
      font: 600 var(--fs-md)/1 var(--font-condensed); letter-spacing: 0.04em; cursor: pointer;
    }
    .btn:hover { background: var(--gold-bright); }
    .note { font-size: var(--fs-sm); color: var(--text-faint); }

    /* A4 sheet with 4 A6 table tents (105 × 148.5 mm) */
    .sheets { display: grid; gap: var(--space-8); justify-content: center; padding-bottom: var(--space-16); }
    .sheet { width: 210mm; height: 297mm; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; background: var(--print-paper); box-shadow: var(--shadow-lg); }
    .tent {
      position: relative; display: grid; justify-items: center; align-content: center; gap: 4mm; padding: 9mm;
      background: var(--brand-green); color: var(--gold-bright); text-align: center; outline: 0.2mm dashed rgba(0, 0, 0, 0.25);
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .tent::before { content: ""; position: absolute; inset: 5mm; border: 0.5mm solid var(--gold); border-radius: 3mm; }
    .tent::after { content: ""; position: absolute; inset: 6.5mm; border: 0.2mm solid var(--gold-deep); border-radius: 2mm; }
    .tent__logo { width: 30mm; height: auto; position: relative; z-index: 1; }
    .tent__kicker { position: relative; z-index: 1; font: 700 11pt/1 var(--font-menu); letter-spacing: 0.18em; text-transform: uppercase; }
    .tent__title { position: relative; z-index: 1; font: 700 17pt/1.1 var(--font-display); color: var(--paper-soft); }
    .tent__qr { position: relative; z-index: 1; width: 44mm; height: 44mm; padding: 2.5mm; background: var(--paper-soft); border-radius: 2mm; }
    .tent__qr svg { display: block; width: 100%; height: 100%; }
    .tent__hint { position: relative; z-index: 1; font: 600 10pt/1.3 var(--font-body); color: var(--paper-soft); }
    .tent__mesa { position: relative; z-index: 1; padding: 1mm 4mm; border: 0.4mm solid var(--gold); border-radius: 10mm; font: 700 12pt/1.2 var(--font-menu); letter-spacing: 0.12em; text-transform: uppercase; }
    .tent__insta { position: relative; z-index: 1; font: 600 9pt/1 var(--font-condensed); letter-spacing: 0.08em; }

    .ink .tent { background: var(--print-paper); color: var(--paper-ink); }
    .ink .tent__title, .ink .tent__hint { color: var(--paper-ink); }
    .ink .tent__qr { background: var(--print-paper); }

    @page { size: A4 portrait; margin: 0; }
    @media print {
      body { background: var(--print-paper); }
      .controls { display: none; }
      .sheets { display: block; padding: 0; }
      .sheet { box-shadow: none; break-after: page; }
      .sheet:last-child { break-after: auto; }
    }
  </style>
</head>
<body>
  <section class="controls" aria-labelledby="qr-titulo">
    <h1 id="qr-titulo">QR codes das mesas</h1>
    <p>Gere os displays de mesa do cardápio digital: 4 por folha A4, prontos para imprimir e recortar. Cada QR leva ao cardápio com o número da mesa.</p>
    <form class="row" id="qr-form">
      <label>Mesa inicial<input type="number" id="de" min="1" max="999" value="1" required></label>
      <label>Mesa final<input type="number" id="ate" min="1" max="999" value="8" required></label>
      <label>Endereço do cardápio<input type="url" id="base" required></label>
      <label class="check"><input type="checkbox" id="sem-mesa"> Sem número de mesa</label>
      <label class="check"><input type="checkbox" id="economia"> Economizar tinta</label>
      <button class="btn" type="button" id="imprimir">Imprimir</button>
    </form>
    <p class="note" id="resumo" role="status"></p>
  </section>
  <div class="sheets" id="folhas" aria-label="Pré-visualização das folhas"></div>

  <script type="module">
    import qrcode from '/assets/vendor/qrcode.js';

    const $ = (s) => document.querySelector(s);
    const SVG_NS = 'http://www.w3.org/2000/svg';
    $('#base').value = `${location.origin}/cardapio`;

    // Draws the QR as a single SVG path (crisp at any print size).
    function qrSvg(text) {
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      const n = qr.getModuleCount();
      let d = '';
      for (let r = 0; r < n; r += 1) for (let c = 0; c < n; c += 1) if (qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('viewBox', `0 0 ${n} ${n}`);
      svg.setAttribute('shape-rendering', 'crispEdges');
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', `QR code para ${text}`);
      const path = document.createElementNS(SVG_NS, 'path');
      path.setAttribute('d', d);
      path.setAttribute('fill', '#14180b');
      svg.append(path);
      return svg;
    }

    function tent(url, mesa) {
      const el = document.createElement('div');
      el.className = 'tent';
      const add = (tag, cls, text) => { const x = document.createElement(tag); x.className = cls; if (text) x.textContent = text; el.append(x); return x; };
      const logo = add('img', 'tent__logo');
      logo.src = '/images/brand/logo-placa-320.webp';
      logo.alt = 'Barcenaria Bar e Restaurante';
      add('p', 'tent__kicker', 'Cardápio digital');
      add('p', 'tent__title', 'Aponte a câmera');
      add('div', 'tent__qr').append(qrSvg(url));
      add('p', 'tent__hint', 'Pratos, drinks, vinhos e a promoção do dia.');
      if (mesa) add('p', 'tent__mesa', `Mesa ${mesa}`);
      add('p', 'tent__insta', '@barcenariaoficial');
      return el;
    }

    function render() {
      const base = $('#base').value.trim() || `${location.origin}/cardapio`;
      const semMesa = $('#sem-mesa').checked;
      let de = Math.max(1, Number($('#de').value) || 1);
      let ate = Math.max(de, Number($('#ate').value) || de);
      ate = Math.min(ate, de + 99);
      const urls = semMesa ? [[base, null], [base, null], [base, null], [base, null]]
        : Array.from({ length: ate - de + 1 }, (_, i) => [`${base}?mesa=${de + i}`, de + i]);
      const sheets = [];
      for (let i = 0; i < urls.length; i += 4) {
        const sheet = document.createElement('div');
        sheet.className = 'sheet';
        urls.slice(i, i + 4).forEach(([u, m]) => sheet.append(tent(u, m)));
        sheets.push(sheet);
      }
      $('#folhas').replaceChildren(...sheets);
      document.body.classList.toggle('ink', $('#economia').checked);
      $('#resumo').textContent = semMesa
        ? '4 displays sem número de mesa (1 folha A4).'
        : `${urls.length} displays, mesas ${de} a ${ate} (${sheets.length} folha${sheets.length > 1 ? 's' : ''} A4).`;
      $('#de').disabled = $('#ate').disabled = semMesa;
    }

    $('#qr-form').addEventListener('input', render);
    $('#imprimir').addEventListener('click', () => window.print());
    render();
  </script>
</body>
</html>
